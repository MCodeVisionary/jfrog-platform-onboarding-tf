name: Apply on merge

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

concurrency:
  group: apply-main
  cancel-in-progress: false   # apply jobs must run to completion serially

permissions:
  contents: read
  pull-requests: write   # post post-apply comment on the merged PR
  id-token: write        # for OIDC token

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Cap per-layer terraform parallelism. JFrog SaaS GRPC pool throws
  # HTTP 429 around ~10 concurrent writes, so we keep it well under that.
  TF_PARALLELISM: "4"

jobs:
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.affected.outputs.layers }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        name: Detect affected Terraform layers
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi
          changed=$(git diff --name-only "$before" "$after" -- 'terraform/**' || true)
          echo "Changed files:"
          echo "$changed"

          layers=()
          if echo "$changed" | grep -q '^terraform/platform/'; then
            layers+=("platform")
          fi
          for proj_dir in terraform/projects/*/; do
            proj=$(basename "$proj_dir")
            if echo "$changed" | grep -q "^terraform/projects/$proj/"; then
              layers+=("projects/$proj")
            fi
          done

          if [ ${#layers[@]} -eq 0 ]; then
            echo "layers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=$(printf '%s\n' "${layers[@]}" | jq -R . | jq -sc .)
          echo "layers=$json" >> "$GITHUB_OUTPUT"

      - id: pr
        name: Find the merged PR number
        run: |
          pr=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "number=$pr" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  apply:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Total concurrent JFrog API calls during apply =
      #   max-parallel (matrix jobs)  x  TF_PARALLELISM (per layer)
      # = 2 x 4 = 8, well under JFrog's ~10-concurrent GRPC limit.
      max-parallel: 2
      matrix:
        layer: ${{ fromJSON(needs.detect-layers.outputs.layers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: jfrog-cli
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: MCodeVisionary/jfrog-platform-onboarding-tf@github

      - name: Resolve auth details for Terraform
        id: jf
        run: |
          set -euo pipefail
          token="${{ steps.jfrog-cli.outputs.oidc-token }}"
          if [ -z "$token" ]; then
            echo "::error::OIDC token was not produced by setup-jfrog-cli — check vars.OIDC_PROVIDER_NAME and JFrog identity mapping."
            exit 1
          fi
          echo "::add-mask::$token"
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( 4 - ${#payload} % 4 )); [ $pad -lt 4 ] && payload="${payload}$(printf '=%.0s' $(seq 1 $pad))"
          subject=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.sub')
          username="${subject##*/}"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          {
            echo "access_token<<EOF"
            echo "$token"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        id: tfapply
        env:
          TF_HTTP_USERNAME: ${{ steps.jf.outputs.username }}
          TF_HTTP_PASSWORD: ${{ steps.jf.outputs.access_token }}
          TF_VAR_jfrog_url: ${{ vars.JF_URL }}
          TF_VAR_jfrog_access_token: ${{ steps.jf.outputs.access_token }}
        working-directory: terraform/${{ matrix.layer }}
        run: |
          set -o pipefail
          terraform init -no-color | tail -5
          set +e
          terraform apply -auto-approve -no-color -parallelism="$TF_PARALLELISM" 2>&1 | tee apply.out
          ec=${PIPESTATUS[0]}
          set -e

          summary=$(grep -E '^Apply complete!' apply.out | tail -1 || echo "")
          add=$(echo "$summary"     | sed -nE 's/.*Resources: ([0-9]+) added.*/\1/p');     add=${add:-0}
          change=$(echo "$summary"  | sed -nE 's/.*added, ([0-9]+) changed.*/\1/p');       change=${change:-0}
          destroy=$(echo "$summary" | sed -nE 's/.*changed, ([0-9]+) destroyed.*/\1/p');   destroy=${destroy:-0}

          {
            echo "add=$add"
            echo "change=$change"
            echo "destroy=$destroy"
            echo "exit_code=$ec"
            echo "status=$( [ $ec -eq 0 ] && echo success || echo failure )"
          } >> "$GITHUB_OUTPUT"
          exit $ec

      - name: Comment on merged PR (red-bold drift banner)
        if: always() && needs.detect-layers.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          LAYER:   ${{ matrix.layer }}
          STATUS:  ${{ steps.tfapply.outputs.status }}
          ADD:     ${{ steps.tfapply.outputs.add }}
          CHANGE:  ${{ steps.tfapply.outputs.change }}
          DESTROY: ${{ steps.tfapply.outputs.destroy }}
          SHA:     ${{ github.sha }}
          PR:      ${{ needs.detect-layers.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try {
              const out = fs.readFileSync(`terraform/${process.env.LAYER}/apply.out`, 'utf8');
              tail = out.split('\n').slice(-60).join('\n');
            } catch (e) {}

            const failed = process.env.STATUS !== 'success';
            const banner = failed
              ? '> [!CAUTION]\n> **Drift has been detected.** Apply FAILED — immediate attention required.'
              : '> [!CAUTION]\n> **Drift has been detected.** Apply completed.';

            const counts = failed
              ? '_(apply did not complete; resource counts unavailable)_'
              : `**Resources:** ${process.env.ADD} added, ${process.env.CHANGE} changed, ${process.env.DESTROY} destroyed.`;

            const body = [
              banner,
              '',
              `**Layer:** \`${process.env.LAYER}\`  `,
              `**Commit:** \`${process.env.SHA}\`  `,
              counts,
              '',
              '<details><summary>Apply log (last 60 lines)</summary>',
              '',
              '```hcl',
              tail,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number(process.env.PR),
              body,
            });
