# ---------------------------------------------------------------------------
# Reusable workflow — exchange a GitHub OIDC token for a short-lived JFrog
# access token, then exports it as TF_HTTP_PASSWORD / TF_VAR_jfrog_access_token
# for use by downstream steps in the calling job.
#
# Setup required on the JFrog side (one-time, by a JFrog admin):
#   Administration → Identity & Access → OIDC Integrations
#     + Provider name: github (or anything you reference below)
#     + Issuer:       https://token.actions.githubusercontent.com
#     + Audience:     jfrog-tf-state         (the audience this workflow asks for)
#     + Identity mapping:
#         claims_json: { "repository": "MCodeVisionary/jfrog-platform-onboarding-tf", "ref": "refs/heads/main" }
#         user_name:   gh-actions-apply       (apply identity — admin scope)
#       AND a second mapping with audience: jfrog-tf-state-plan, user: gh-actions-plan (read-only)
#
# The audience claim is the only thing distinguishing plan vs apply OIDC trust.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      audience:
        description: 'OIDC audience claim — distinguishes plan from apply identity'
        required: true
        type: string
      jfrog_url:
        description: 'JFrog Platform base URL'
        required: true
        type: string
    outputs:
      access_token:
        description: 'Short-lived JFrog access token'
        value: ${{ jobs.exchange.outputs.access_token }}
      username:
        description: 'JFrog username (token subject)'
        value: ${{ jobs.exchange.outputs.username }}

jobs:
  exchange:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required to mint the GitHub OIDC token
    outputs:
      access_token: ${{ steps.tok.outputs.access_token }}
      username:     ${{ steps.tok.outputs.username }}
    steps:
      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const tok = await core.getIDToken('${{ inputs.audience }}');
            core.setSecret(tok);
            core.setOutput('id_token', tok);
      - name: Exchange GitHub OIDC token for JFrog access token
        id: tok
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.id_token }}
          JFROG_URL:  ${{ inputs.jfrog_url }}
        run: |
          set -euo pipefail
          # POST to /access/api/v1/oidc/token with the GitHub OIDC token.
          # JFrog returns a short-lived JFrog access token bound to the configured user.
          payload=$(jq -nc --arg t "$OIDC_TOKEN" --arg p "github" \
            '{ subject_token: $t, subject_token_type: "urn:ietf:params:oauth:token-type:id_token", provider_name: $p }')
          response=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$JFROG_URL/access/api/v1/oidc/token")
          jf_token=$(echo "$response" | jq -r '.access_token')
          if [ -z "$jf_token" ] || [ "$jf_token" = "null" ]; then
            echo "OIDC exchange failed: $response" >&2
            exit 1
          fi
          # Mask token, decode username from sub claim
          echo "::add-mask::$jf_token"
          subject=$(echo "$jf_token" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub' || true)
          username="${subject##*/}"
          echo "access_token=$jf_token" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
