name: "Setup JFrog CLI OIDC Example"

# Manual-trigger only. Kept as a minimal OIDC smoke test (validates JFrog
# CLI auth via OIDC by running `jf rt ping`) but no longer fires on every
# push. To run: GitHub UI → Actions tab → "Setup JFrog CLI OIDC Example"
# → Run workflow.
on:
  workflow_dispatch:

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  # This is required for actions/checkout
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: MCodeVisionary/jfrog-platform-onboarding-tf@github

      - name: Run JFrog CLI
        run: |
          # Ping the server
          jf rt ping
