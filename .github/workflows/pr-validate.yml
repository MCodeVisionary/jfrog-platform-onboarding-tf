name: PR Validate

on:
  pull_request:
    paths:
      - 'terraform/**'

# Cancel in-flight runs when a new commit is pushed to the same PR
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # post plan comment
  id-token: write        # OIDC

env:
  JFROG_URL: https://mcodevisionaryorg.jfrog.io
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.affected.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        name: Detect affected Terraform layers
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- 'terraform/**' || true)
          echo "Changed files:"
          echo "$changed"

          layers=()
          if echo "$changed" | grep -q '^terraform/platform/'; then
            layers+=("platform")
          fi
          for proj_dir in terraform/projects/*/; do
            proj=$(basename "$proj_dir")
            if echo "$changed" | grep -q "^terraform/projects/$proj/"; then
              layers+=("projects/$proj")
            fi
          done

          # Module changes alone don't trigger applies (modules are pinned by tag)
          # but they DO trigger PR validation on every layer to verify nothing breaks.
          if echo "$changed" | grep -q '^terraform/modules/'; then
            layers=("platform" "projects/cmrc" "projects/vntg" "projects/wlt")
          fi

          if [ ${#layers[@]} -eq 0 ]; then
            echo "No Terraform layers affected."
            echo "layers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${layers[@]}" | jq -R . | jq -sc .)
          echo "Affected layers: $json"
          echo "layers=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.detect-layers.outputs.layers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      - name: Exchange GitHub OIDC for JFrog token (plan scope)
        id: jf
        uses: actions/github-script@v7
        env:
          JFROG_URL: ${{ env.JFROG_URL }}
        with:
          script: |
            const oidc = await core.getIDToken('jfrog-tf-state-plan');
            const fetch = (await import('node-fetch')).default;
            const res = await fetch(`${process.env.JFROG_URL}/access/api/v1/oidc/token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                subject_token: oidc,
                subject_token_type: 'urn:ietf:params:oauth:token-type:id_token',
                provider_name: 'github',
              })
            });
            const body = await res.json();
            if (!body.access_token) {
              core.setFailed(`OIDC exchange failed: ${JSON.stringify(body)}`);
              return;
            }
            core.setSecret(body.access_token);
            // Decode sub claim for username
            const payload = JSON.parse(Buffer.from(body.access_token.split('.')[1], 'base64').toString());
            const username = (payload.sub || '').split('/').pop();
            core.setOutput('access_token', body.access_token);
            core.setOutput('username', username);

      - name: Terraform init + plan
        id: tfplan
        env:
          TF_HTTP_USERNAME: ${{ steps.jf.outputs.username }}
          TF_HTTP_PASSWORD: ${{ steps.jf.outputs.access_token }}
          TF_VAR_jfrog_url: ${{ env.JFROG_URL }}
          TF_VAR_jfrog_access_token: ${{ steps.jf.outputs.access_token }}
        working-directory: terraform/${{ matrix.layer }}
        run: |
          set -o pipefail
          terraform init -no-color | tail -5
          set +e
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.out
          ec=${PIPESTATUS[0]}
          set -e
          terraform show -no-color tfplan > plan.txt 2>/dev/null || cp plan.out plan.txt

          # Extract resource counts from plan summary
          summary=$(grep -E '^Plan: ' plan.out | tail -1 || echo "Plan: 0 to add, 0 to change, 0 to destroy.")
          add=$(echo "$summary"     | sed -nE 's/.*Plan: ([0-9]+) to add.*/\1/p');     add=${add:-0}
          change=$(echo "$summary"  | sed -nE 's/.*([0-9]+) to change.*/\1/p');         change=${change:-0}
          destroy=$(echo "$summary" | sed -nE 's/.*([0-9]+) to destroy.*/\1/p');        destroy=${destroy:-0}

          echo "add=$add"         >> "$GITHUB_OUTPUT"
          echo "change=$change"   >> "$GITHUB_OUTPUT"
          echo "destroy=$destroy" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "exit_code=$ec"    >> "$GITHUB_OUTPUT"
          exit $ec

      - name: Post plan as PR comment (red-bold drift banner)
        if: always()
        uses: actions/github-script@v7
        env:
          LAYER:     ${{ matrix.layer }}
          ADD:       ${{ steps.tfplan.outputs.add }}
          CHANGE:    ${{ steps.tfplan.outputs.change }}
          DESTROY:   ${{ steps.tfplan.outputs.destroy }}
          SUMMARY:   ${{ steps.tfplan.outputs.summary }}
          EXIT:      ${{ steps.tfplan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = `terraform/${process.env.LAYER}/plan.txt`;
            let plan = '';
            try { plan = fs.readFileSync(path, 'utf8'); } catch (e) { plan = '(plan output unavailable)'; }

            // GitHub PR comment limit ~65k chars — truncate
            const MAX = 50000;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n\n... (truncated) ...';

            const failed = process.env.EXIT !== '0';
            const banner = failed
              ? '> [!CAUTION]\n> **Drift has been detected.** Plan failed for this layer — see error below.'
              : '> [!CAUTION]\n> **Drift has been detected.** Review the plan carefully before merging.';

            const body = [
              banner,
              '',
              `**Layer:** \`${process.env.LAYER}\`  `,
              `**Plan:** ${process.env.SUMMARY}`,
              '',
              `| Add | Change | Destroy |`,
              `|---|---|---|`,
              `| ${process.env.ADD} | ${process.env.CHANGE} | ${process.env.DESTROY} |`,
              '',
              '<details><summary>Full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
            ].join('\n');

            // Find existing comment for this layer and update; otherwise create new.
            const marker = `<!-- pr-validate:${process.env.LAYER} -->`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }
