name: PR Validate

on:
  pull_request:
    paths:
      - 'terraform/**'

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # post plan comment

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Cap per-layer terraform parallelism. JFrog SaaS GRPC pool throws
  # HTTP 429 around ~10 concurrent writes, so we keep it well under that.
  TF_PARALLELISM: "4"

jobs:
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.affected.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        name: Detect affected Terraform layers
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- 'terraform/**' || true)
          echo "Changed files:"
          echo "$changed"

          layers=()
          if echo "$changed" | grep -q '^terraform/platform/'; then
            layers+=("platform")
          fi
          for proj_dir in terraform/projects/*/; do
            proj=$(basename "$proj_dir")
            if echo "$changed" | grep -q "^terraform/projects/$proj/"; then
              layers+=("projects/$proj")
            fi
          done

          # Module changes alone don't trigger applies (modules are pinned by tag),
          # but they trigger validation on every layer to verify nothing breaks.
          if echo "$changed" | grep -q '^terraform/modules/'; then
            layers=("platform" "projects/cmrc" "projects/vntg" "projects/wlt")
          fi

          if [ ${#layers[@]} -eq 0 ]; then
            echo "No Terraform layers affected."
            echo "layers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${layers[@]}" | jq -R . | jq -sc .)
          echo "Affected layers: $json"
          echo "layers=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.detect-layers.outputs.layers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      - name: Terraform init + plan
        id: tfplan
        env:
          # Static-auth flow (no OIDC). Username from a repo Variable, token
          # from a repo Secret. The same secret feeds both consumers:
          #   - TF_HTTP_PASSWORD          → HTTP state backend (basic-auth)
          #   - TF_VAR_jfrog_access_token → var.jfrog_access_token (providers)
          TF_HTTP_USERNAME:          ${{ vars.TF_HTTP_USERNAME }}
          TF_HTTP_PASSWORD:          ${{ secrets.JFROG_ACCESS_TOKEN }}
          TF_VAR_jfrog_url:          ${{ vars.JF_URL }}
          TF_VAR_jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
        working-directory: terraform/${{ matrix.layer }}
        run: |
          set -o pipefail
          terraform init -no-color | tail -5
          set +e
          terraform plan -no-color -parallelism="$TF_PARALLELISM" -out=tfplan 2>&1 | tee plan.out
          ec=${PIPESTATUS[0]}
          set -e
          terraform show -no-color tfplan > plan.txt 2>/dev/null || cp plan.out plan.txt

          summary=$(grep -E '^Plan: ' plan.out | tail -1 || echo "Plan: 0 to add, 0 to change, 0 to destroy.")
          add=$(echo "$summary"     | sed -nE 's/.*Plan: ([0-9]+) to add.*/\1/p');     add=${add:-0}
          change=$(echo "$summary"  | sed -nE 's/.*([0-9]+) to change.*/\1/p');         change=${change:-0}
          destroy=$(echo "$summary" | sed -nE 's/.*([0-9]+) to destroy.*/\1/p');        destroy=${destroy:-0}

          {
            echo "add=$add"
            echo "change=$change"
            echo "destroy=$destroy"
            echo "summary=$summary"
            echo "exit_code=$ec"
          } >> "$GITHUB_OUTPUT"
          exit $ec

      - name: Post plan as PR comment (red-bold drift banner)
        if: always()
        uses: actions/github-script@v7
        env:
          LAYER:    ${{ matrix.layer }}
          ADD:      ${{ steps.tfplan.outputs.add }}
          CHANGE:   ${{ steps.tfplan.outputs.change }}
          DESTROY:  ${{ steps.tfplan.outputs.destroy }}
          SUMMARY:  ${{ steps.tfplan.outputs.summary }}
          EXIT:     ${{ steps.tfplan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = `terraform/${process.env.LAYER}/plan.txt`;
            let plan = '';
            try { plan = fs.readFileSync(path, 'utf8'); } catch (e) { plan = '(plan output unavailable)'; }

            const MAX = 50000;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n\n... (truncated) ...';

            const failed = process.env.EXIT !== '0';
            const banner = failed
              ? '> [!CAUTION]\n> **Drift has been detected.** Plan failed for this layer — see error below.'
              : '> [!CAUTION]\n> **Drift has been detected.** Review the plan carefully before merging.';

            const body = [
              banner,
              '',
              `**Layer:** \`${process.env.LAYER}\`  `,
              `**Plan:** ${process.env.SUMMARY}`,
              '',
              `| Add | Change | Destroy |`,
              `|---|---|---|`,
              `| ${process.env.ADD} | ${process.env.CHANGE} | ${process.env.DESTROY} |`,
              '',
              '<details><summary>Full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
            ].join('\n');

            const marker = `<!-- pr-validate:${process.env.LAYER} -->`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }
